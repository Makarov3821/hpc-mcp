[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xn02-mcps"
version = "0.1.0"
description = "SSH-based LSF and Slurm cluster inspection and batch job management"
requires-python = ">=3.11"
dependencies = []
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/Makarov3821/hpc-mcp"
Issues = "https://github.com/Makarov3821/hpc-mcp/issues"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
xn02 = "xn02_mcps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
